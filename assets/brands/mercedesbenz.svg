<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white">
  <!-- Outer ring -->
  <circle cx="12" cy="12" r="11.2" fill="none" stroke="white" stroke-width="0.8"/>
  <!-- Inner ring -->
  <circle cx="12" cy="12" r="4.8" fill="none" stroke="white" stroke-width="0.8"/>
  <!-- Three-pointed star: top point -->
  <line x1="12" y1="0.8" x2="12" y2="12" stroke="white" stroke-width="1.1"/>
  <!-- Bottom-right point -->
  <line x1="12" y1="12" x2="21.6" y2="18.4" stroke="white" stroke-width="1.1"/>
  <!-- Bottom-left point -->
  <line x1="12" y1="12" x2="2.4" y2="18.4" stroke="white" stroke-width="1.1"/>
</svg>
