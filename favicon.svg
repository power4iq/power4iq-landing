  <polygon points="38,16 23,23 20,20" fill="#009EDF"/>
  <polygon points="23,23 30,23 20,20" fill="#0062BE"/>
  <polygon points="30,23 14,38 20,20" fill="#00308A"/>
  <polygon points="14,38  2,24 20,20" fill="#000818"/>
  <polygon points=" 2,24 17,17 20,20" fill="#001438"/>
  <polygon points="17,17 10,17 20,20" fill="#002460"/>
  <polygon points="10,17 27,2  20,20" fill="#004EAA"/>
  <line x1="27" y1="2"  x2="20" y2="20" stroke="#000510" stroke-width="0.5"/>
  <line x1="14" y1="38" x2="20" y2="20" stroke="#000510" stroke-width="0.5"/>
