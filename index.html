          "@type": "Question",
          "name": "¿Qué es un estudio de cargabilidad eléctrica para vehículos eléctricos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El estudio de cargabilidad eléctrica (EV Ready Study) analiza la capacidad de la red eléctrica de tu edificio, conjunto o empresa para soportar cargadores de vehículos eléctricos. Mide la potencia disponible, la capacidad del transformador, el estado del tablero y el circuito necesario para instalar cargadores AC o DC de forma segura y certificada bajo RETIE en Colombia."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto cuesta instalar un cargador para vehículo eléctrico en Colombia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El costo de instalación de un cargador EV en Colombia depende del tipo: residencial básico (wallbox AC 7-11 kW) desde ~$3.5M COP; residencial premium con conectividad desde ~$6M COP; soluciones para conjuntos y empresas varían según la obra civil, distancia al tablero y número de puntos. Power4IQ entrega cotización sin costo previo al diagnóstico."
          }
        },
        {
          "@type": "Question",
          "name": "¿Necesito certificación RETIE para instalar un cargador eléctrico en Colombia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. En Colombia toda instalación eléctrica, incluida la de cargadores para vehículos eléctricos, debe cumplir el Reglamento Técnico de Instalaciones Eléctricas (RETIE). Power4IQ realiza el diseño, la instalación y gestiona la inspección y marcación RETIE como parte del servicio llave en mano."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué diferencia hay entre carga AC y carga DC para vehículos eléctricos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La carga AC (alterna) usa el cargador interno del vehículo. Potencias típicas: 7 kW (residencial), 11-22 kW (empresarial). La carga DC (directa o rápida) envía corriente directamente a la batería, potencias desde 30 kW hasta 350 kW, reduciendo el tiempo de carga a 20-60 minutos. Power4IQ instala ambos tipos según el caso de uso: casa, conjunto, flota o corredor de carga."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué cargadores son compatibles con BYD, MG, Zeekr y demás marcas chinas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Todos los cargadores Power4IQ usan conector tipo 2 (Mennekes), el estándar adoptado en Colombia y soportado nativamente por BYD, MG, Zeekr, Chery, GAC. Para VEs con conector tipo 1 (Tesla pre-2023, algunos Leaf) entregamos adaptador certificado. La compatibilidad está validada con cada VE matriculado en Colombia."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo se monetiza un parqueadero con cargadores de vehículos eléctricos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Con el modelo Nexo Business de Power4IQ puedes convertir espacios de parqueo en puntos de carga rentables mediante revenue sharing: Power4IQ instala y opera los cargadores, y comparte los ingresos generados por sesión contigo. No requiere inversión inicial del propietario del espacio."
          }
        },
        {
          "@type": "Question",
          "name": "¿Necesito subestación o transformador adicional para instalar carga rápida?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Para residencial AC (7-22 kW) normalmente no — el tablero existente puede absorberlo si tiene capacidad. Para carga DC empresarial o flotas, el EV Ready Study mide la capacidad real disponible, identifica si la subestación tiene reserva y diseña el tablero EV dedicado. En el 80% de los casos no se requiere subestación nueva si la potencia contratada se planifica bien."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo migrar de un proveedor existente sin perder mi protocolo OCPP?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Si tu cargador actual habla OCPP 1.6j o superior, lo migramos a la consola Power4IQ sin cambiar hardware. Sesiones históricas archivadas, balance contable preservado. Migración típica: 24-48 horas, sin interrumpir la operación."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo se balancea la carga con 8 cargadores en un parqueo de solo 60 kW?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La consola Power4IQ hace load balancing dinámico: redistribuye los 60 kW en tiempo real entre los vehículos activos. 2 cargando = hasta 30 kW c/u; 8 cargando = baja proporcionalmente sin disparar protecciones. Soporta priorización por ruta, horario o usuario premium."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto tiempo demora el trámite de marcación RETIE para cargadores EV?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "RETIE residencial típico: 5-10 días hábiles incluyendo inspección. Para conjuntos o comercios con tablero EV dedicado, la revisión por organismo de inspección (RETIE comercial/industrial) tarda 2-3 semanas. Toda la documentación queda archivada con NIT y nombre del RETIE firmante para tu acta."
          }
        }
      ]
    }
